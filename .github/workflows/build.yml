name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # THE FIX: Backup your code, generate the Android folder, then restore your code
      - name: Scaffold Android Project Safely
        run: |
          mkdir backup
          cp -r lib backup/
          cp pubspec.yaml backup/
          
          # This generates the android folder and .metadata file
          flutter create --org org.jobbot --project-name jobbot .
          
          # Delete the default counter app Flutter just created
          rm -rf lib
          
          # Put YOUR code back
          cp -r backup/lib .
          cp backup/pubspec.yaml .
          rm -rf backup

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobbot-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
