name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # THE FIX: Create the Android folders in a temp folder, then move them over
      - name: Scaffold Android Project
        run: |
          flutter create --org org.jobbot --project-name jobbot temp_flutter
          cp -r temp_flutter/android .
          cp -r temp_flutter/ios .
          cp temp_flutter/.metadata .
          rm -rf temp_flutter

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobbot-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
