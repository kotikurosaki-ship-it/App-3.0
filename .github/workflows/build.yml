name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # THE FIX: Creates 'lib' if missing, moves files, and safely scaffolds Android
      - name: Scaffold Android Project Safely
        run: |
          mkdir -p backup
          
          # If lib exists, back it up. If not, create it and move loose dart files into it.
          if [ -d "lib" ]; then
            cp -r lib backup/
          else
            mkdir lib
            mv *.dart lib/ 2>/dev/null || true
            cp -r lib backup/
          fi
          
          cp pubspec.yaml backup/ 2>/dev/null || true
          
          # Generate the Android folders
          flutter create --org org.jobbot --project-name jobbot .
          
          # Restore YOUR code over the default counter app
          cp -r backup/lib/* lib/
          cp backup/pubspec.yaml . 2>/dev/null || true
          rm -rf backup

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobbot-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
